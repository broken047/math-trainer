<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Математический тренажёр</title>
    <style>
        :root {
            --bg-color: #f0f2f5; --panel-bg: #ffffff; --text-color: #333;
            --primary-color: #4a90e2; --success-color: #2ecc71; --error-color: #e74c3c;
            --border-color: #ccc; --item-bg: #f8fafc; --item-border: #e2e8f0;
            --warning-color: #e2b007; --keyboard-height: 0px;
        }
        [data-theme="dark"] {
            --bg-color: #1a1a1a; --panel-bg: #2d2d2d; --text-color: #ecf0f1;
            --primary-color: #3498db; --success-color: #27ae60; --error-color: #c0392b;
            --item-bg: #3a3a3a; --item-border: #4a4a4a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden; padding: 10px; transition: background 0.3s;
        }
        .top-bar {
            background: var(--panel-bg); padding: 10px 20px; border-radius: 8px;
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-shrink: 0;
        }
        .controls-left { display: flex; gap: 10px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        .btn-start { background-color: var(--primary-color); color: white; }
        .btn-check { background-color: var(--success-color); color: white; }
        .btn-settings { background-color: #7f8c8d; color: white; }
        .btn-theme { background-color: #f1c40f; color: #333; }
        .btn:hover { opacity: 0.9; }
        .workspace { display: flex; flex: 1; gap: 10px; min-height: 0; }
        /* Ширина колонки (--col-min) зависит от длины самого длинного примера, её задаёт generateTraining() */
        .examples-grid {
            flex: 1; background: var(--panel-bg); border-radius: 8px; padding: 15px; overflow-y: auto;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--col-min, 11em)), 1fr));
            grid-auto-rows: 1fr; gap: 12px; align-content: start;
            font-size: clamp(18px, 0.9vw + 1vh, 30px); font-weight: bold;
        }
        .example-item {
            background: var(--item-bg); border: 1px solid var(--item-border); border-radius: 8px;
            display: flex; align-items: center; gap: 0.4em; padding: 0.4em 0.6em;
        }
        .example-text { flex: 1; text-align: right; line-height: 1.35; }
        /* Только на время замера ширины в fitColumnsToExamples() */
        .examples-grid.measuring { grid-template-columns: max-content; }
        .examples-grid.measuring .example-item { width: max-content; }
        .examples-grid.measuring .example-text { white-space: nowrap; }
        .answer-input { width: var(--answer-width, 4.4em); flex-shrink: 0; padding: 0.3em; font-size: 0.8em; font-weight: bold; text-align: center; border: 2px solid var(--border-color); border-radius: 6px; outline: none; background: var(--panel-bg); color: var(--text-color); }
        .answer-input.correct { border-color: var(--success-color); background-color: rgba(46,204,113,0.15); color: var(--success-color); }
        .answer-input.incorrect { border-color: var(--error-color); background-color: rgba(231,76,60,0.15); }
        .answer-input.almost { border-color: var(--warning-color); background-color: rgba(241,196,15,0.2); }
        /* Обыкновенная дробь в примере: числитель над чертой, знаменатель под ней */
        .frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font-size: 0.75em; line-height: 1.15; margin: 0 0.1em; }
        .frac > span { padding: 0 0.15em; }
        .frac > span:first-child { border-bottom: 0.1em solid currentColor; }
        /* Ответ обыкновенной дробью: целая часть, справа числитель над знаменателем */
        .frac-answer { display: inline-flex; align-items: center; gap: 0.25em; flex-shrink: 0; }
        .frac-input { display: inline-flex; flex-direction: column; align-items: center; gap: 0.15em; }
        .frac-input .answer-input { width: 2.9em; padding: 0.1em; font-size: 0.7em; }
        .frac-bar { width: 100%; border-top: 0.1em solid currentColor; }
        .frac-answer .answer-whole { width: min(var(--answer-width, 4.4em), 3.6em); }
        .sign-toggle { flex-shrink: 0; width: 1.7em; height: 1.7em; font-size: 0.7em; font-weight: bold; border: 1px solid var(--border-color); border-radius: 6px; background: var(--panel-bg); color: var(--text-color); cursor: pointer; }
        .sidebar { width: 220px; background: var(--panel-bg); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .info-box { border: 1px dashed var(--border-color); border-radius: 6px; padding: 10px; text-align: center; font-size: 14px; }
        .timer-display { font-size: 28px; font-weight: bold; font-family: monospace; }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center; z-index: 1000; visibility: hidden; opacity: 0; transition: opacity 0.2s;
        }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-content { background: var(--panel-bg); color: var(--text-color); padding: 25px; border-radius: 10px; width: 450px; max-width: 90%; max-height: 90%; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .modal-header { font-size: 20px; font-weight: bold; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .setting-row { display: flex; flex-direction: column; gap: 5px; }
        .setting-row label { font-weight: 500; font-size: 14px; }
        .setting-row select, .setting-row input { padding: 6px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-color); color: var(--text-color); }
        .setting-row .checkbox-row { display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .checkbox-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px; }
        .checkbox-list label { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
        /* Телефоны и планшеты: страница прокручивается, а снизу остаётся место под экранную клавиатуру,
           чтобы нижние примеры можно было поднять над ней */
        @media (max-width: 900px), (pointer: coarse), (hover: none) {
            body { height: auto; min-height: 100vh; overflow: auto; padding-bottom: calc(10px + var(--keyboard-height)); }
            .top-bar { flex-wrap: wrap; gap: 10px; padding: 10px; }
            .controls-left { flex-wrap: wrap; }
            .workspace { flex-direction: column-reverse; }
            .sidebar { width: auto; flex-direction: row; }
            .sidebar .info-box { flex: 1; }
            .examples-grid { overflow: visible; grid-auto-rows: auto; padding: 10px; font-size: clamp(20px, 2vw + 12px, 28px); }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="controls-left">
            <button class="btn btn-start" onclick="generateTraining()">Старт</button>
            <button class="btn btn-check" onclick="checkAnswers()">Проверка</button>
            <button class="btn btn-settings" onclick="toggleModal(true)">⚙️ Настройки</button>
        </div>
        <button class="btn btn-theme" onclick="toggleTheme()">🌓 Тема</button>
    </div>

    <div class="workspace">
        <div class="examples-grid" id="examples-container"></div>
        <div class="sidebar">
            <div class="info-box">
                <div class="timer-display" id="timer-display">00:00</div>
                <div style="font-size:12px; margin-top:5px;">Время тренировки</div>
            </div>
            <div class="info-box" style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
                <small id="hint-text">Нажмите «Старт» для начала.</small>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="settings-modal" onclick="if(event.target===this) toggleModal(false)">
        <div class="modal-content">
            <div class="modal-header">Настройки тренажёра</div>
            <div class="setting-row">
                <label>Арифметические операции:</label>
                <div class="checkbox-list">
                    <label><input type="checkbox" id="op-add" checked onchange="saveAllSettings()"> Сложение (+)</label>
                    <label><input type="checkbox" id="op-sub" checked onchange="saveAllSettings()"> Вычитание (−)</label>
                    <label><input type="checkbox" id="op-mul" onchange="saveAllSettings()"> Умножение (×)</label>
                    <label><input type="checkbox" id="op-div" onchange="saveAllSettings()"> Деление (÷)</label>
                </div>
            </div>
            <div class="setting-row">
                <label for="actions-count" id="actions-label">Количество действий в примере (1–10):</label>
                <input type="number" id="actions-count" min="1" max="10" value="1" onchange="saveAllSettings()">
            </div>
            <div class="setting-row">
                <label for="max-range">Предел и сложность счёта:</label>
                <select id="max-range" onchange="adjustOptions(); saveAllSettings();">
                    <option value="10">До 10 (однозначные)</option>
                    <option value="20">До 20 (переход через десяток)</option>
                    <option value="100" selected>До 100 (двузначные)</option>
                    <option value="1000">До 1000 (трёхзначные)</option>
                    <option value="10000">До 10 000 (четырёхзначные)</option>
                    <option value="100000">До 100 000 (пятизначные)</option>
                    <option value="9999999">До 9 999 999 (семизначные)</option>
                </select>
            </div>
            <div class="setting-row">
                <label>Числа:</label>
                <div class="checkbox-list">
                    <label><input type="checkbox" id="opt-negatives" onchange="adjustOptions(); saveAllSettings();"> Отрицательные</label>
                    <label><input type="checkbox" id="opt-fractions" onchange="adjustOptions(); saveAllSettings();"> Обыкновенные дроби</label>
                    <label><input type="checkbox" id="opt-decimals" onchange="adjustOptions(); saveAllSettings();"> Десятичные дроби</label>
                </div>
            </div>
            <div class="setting-row" id="fraction-options">
                <label for="fraction-denominators">Знаменатели обыкновенных дробей:</label>
                <select id="fraction-denominators" onchange="saveAllSettings()">
                    <option value="same" selected>Одинаковые в примере</option>
                    <option value="different">Разные</option>
                </select>
                <label class="checkbox-row"><input type="checkbox" id="opt-strict-fractions" checked onchange="saveAllSettings()"> Ответ — несократимая дробь с выделенной целой частью</label>
            </div>
            <div class="setting-row" id="decimal-options">
                <label for="decimal-places">Знаков после запятой:</label>
                <select id="decimal-places" onchange="saveAllSettings()">
                    <option value="1" selected>1 (десятые)</option>
                    <option value="2">До 2 (сотые)</option>
                    <option value="3">До 3 (тысячные)</option>
                </select>
            </div>
            <div class="setting-row" id="complexity-container">
                <label for="complexity-type">Тип вычислений:</label>
                <select id="complexity-type" onchange="saveAllSettings()">
                    <option value="all" selected>Все типы примеров</option>
                    <option value="no-carry">Без перехода / без заимствования</option>
                    <option value="carry">Обязательно с переходом / с заимствованием</option>
                </select>
            </div>
            <button class="btn btn-start" style="margin-top:10px;" onclick="toggleModal(false); generateTraining();">Применить и Начать</button>
        </div>
    </div>
    <script>
        let currentExamples = []; let timerInterval = null; let secondsElapsed = 0;
        let isTrainingActive = false; let currentSettings = null;
        const EXAMPLES_COUNT = 20;
        // Чем длиннее числа, тем меньше действий: семизначные в уме в десять действий никто не считает
        const MAX_ACTIONS_BY_RANGE = { 10000: 5, 100000: 4, 9999999: 3 };
        function maxActionsFor(range) { return MAX_ACTIONS_BY_RANGE[range] || 10; }
        const OP_SIGNS = { '+': '+', '-': '−', '*': '×', '/': '÷' };
        const NBSP = ' ';          // знак действия не отрывается от числа при переносе строки
        const THIN_NBSP = ' ';     // узкий неразрывный пробел между разрядами
        const NEGATIVE_SHARE = 0.3;     // доля отрицательных чисел, когда они включены
        const PARENS_SHARE = 0.35;      // доля «(a + b) × c» среди умножений и делений после сложения
        const ONE_SHARE = 0.25;         // «± 1» выпадает в 4 раза реже других чисел
        const GENERATION_BUDGET_MS = 300; // не дольше этого на один пример
        const INT_SHARE = 0.25;        // доля целых чисел, когда включены дроби
        const MIXED_SHARE = 0.3;        // доля смешанных чисел («2 3/4») среди обыкновенных дробей
        const MAX_FRACTION_DEN = 10;    // знаменатели дробей в примере — от 2 до 10
        const MAX_DENOMINATOR = 100;    // наибольший знаменатель ответа и промежуточных результатов
        const MIXED_SEPARATOR = '\u2009'; // между целой и дробной частью в текстовой записи «2 3/4»

        function toggleModal(show) { document.getElementById('settings-modal').classList.toggle('active', show); }

        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', currentTheme);
            localStorage.setItem('math_trainer_theme', currentTheme);
        }

        function adjustOptions() {
            const rangeSelect = document.getElementById('max-range');
            if (!rangeSelect.value) rangeSelect.value = '100';   // сохранён предел, которого больше нет в списке
            const range = rangeSelect.value;
            const negatives = document.getElementById('opt-negatives').checked;
            const fractions = document.getElementById('opt-fractions').checked;
            const decimals = document.getElementById('opt-decimals').checked;
            // Переход через разряд имеет смысл только для целых неотрицательных чисел больше 10
            document.getElementById('complexity-container').style.display = (range === '10' || negatives || fractions || decimals) ? 'none' : 'flex';
            document.getElementById('fraction-options').style.display = fractions ? 'flex' : 'none';
            document.getElementById('decimal-options').style.display = decimals ? 'flex' : 'none';

            const maxActions = maxActionsFor(parseInt(range));
            const actionsInput = document.getElementById('actions-count');
            actionsInput.max = maxActions;
            if (parseInt(actionsInput.value) > maxActions) actionsInput.value = maxActions;
            document.getElementById('actions-label').textContent = 'Количество действий в примере (1–' + maxActions + '):';
        }

        function saveAllSettings() {
            const config = {
                add: document.getElementById('op-add').checked,
                sub: document.getElementById('op-sub').checked,
                mul: document.getElementById('op-mul').checked,
                div: document.getElementById('op-div').checked,
                actions: document.getElementById('actions-count').value,
                range: document.getElementById('max-range').value,
                negatives: document.getElementById('opt-negatives').checked,
                fractions: document.getElementById('opt-fractions').checked,
                denominators: document.getElementById('fraction-denominators').value,
                strictFractions: document.getElementById('opt-strict-fractions').checked,
                decimals: document.getElementById('opt-decimals').checked,
                decimalPlaces: document.getElementById('decimal-places').value,
                complexity: document.getElementById('complexity-type').value
            };
            localStorage.setItem('math_trainer_config', JSON.stringify(config));
        }

        function loadAllSettings() {
            const savedTheme = localStorage.getItem('math_trainer_theme');
            if (savedTheme) document.body.setAttribute('data-theme', savedTheme);

            const savedConfig = localStorage.getItem('math_trainer_config');
            if (savedConfig) {
                try {
                    const config = JSON.parse(savedConfig);
                    document.getElementById('op-add').checked = config.add;
                    document.getElementById('op-sub').checked = config.sub;
                    document.getElementById('op-mul').checked = config.mul;
                    document.getElementById('op-div').checked = config.div;
                    document.getElementById('actions-count').value = config.actions;
                    document.getElementById('max-range').value = config.range;
                    document.getElementById('opt-negatives').checked = !!config.negatives;
                    document.getElementById('opt-fractions').checked = !!config.fractions;
                    document.getElementById('fraction-denominators').value = config.denominators || 'same';
                    document.getElementById('opt-strict-fractions').checked = config.strictFractions !== false;
                    document.getElementById('opt-decimals').checked = !!config.decimals;
                    document.getElementById('decimal-places').value = config.decimalPlaces || '1';
                    document.getElementById('complexity-type').value = config.complexity;
                } catch(e) { console.error("Ошибка чтения конфига", e); }
            }
            adjustOptions();
        }

        function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

        function getSelectedOperations() {
            const ops = [];
            if (document.getElementById('op-add').checked) ops.push('+');
            if (document.getElementById('op-sub').checked) ops.push('-');
            if (document.getElementById('op-mul').checked) ops.push('*');
            if (document.getElementById('op-div').checked) ops.push('/');
            return ops;
        }

        function getSettings() {
            return {
                ops: getSelectedOperations(),
                actions: Math.min(Math.max(parseInt(document.getElementById('actions-count').value) || 1, 1),
                                  maxActionsFor(parseInt(document.getElementById('max-range').value))),
                range: parseInt(document.getElementById('max-range').value) || 100,
                negatives: document.getElementById('opt-negatives').checked,
                fractions: document.getElementById('opt-fractions').checked,
                sameDenominators: document.getElementById('fraction-denominators').value === 'same',
                strictFractions: document.getElementById('opt-strict-fractions').checked,
                decimals: document.getElementById('opt-decimals').checked,
                decimalPlaces: parseInt(document.getElementById('decimal-places').value) || 1,
                complexity: document.getElementById('complexity-type').value
            };
        }

        // ---- Точная арифметика: число — несократимая дробь { n, d }, d > 0; целые — со знаменателем 1 ----
        function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; }
        function rat(n, d = 1) {
            if (d < 0) { n = -n; d = -d; }
            const g = gcd(n, d) || 1;
            return { n: n / g + 0, d: d / g };
        }
        const ratAdd = (a, b) => rat(a.n * b.d + b.n * a.d, a.d * b.d);
        const ratMul = (a, b) => rat(a.n * b.n, a.d * b.d);
        const ratDiv = (a, b) => rat(a.n * b.d, a.d * b.n);
        const ratNeg = a => rat(-a.n, a.d);
        const ratAbs = a => rat(Math.abs(a.n), a.d);
        const ratCmp = (a, b) => a.n * b.d - b.n * a.d;
        const ratFloor = a => Math.floor(a.n / a.d);
        const ratEq = (a, b) => a.n === b.n && a.d === b.d;

        // Сколько знаков после запятой у десятичной записи; Infinity — если дробь бесконечная (1/3)
        function decimalPlaces(a) {
            let d = a.d, twos = 0, fives = 0;
            while (d % 2 === 0) { d /= 2; twos++; }
            while (d % 5 === 0) { d /= 5; fives++; }
            return d === 1 ? Math.max(twos, fives) : Infinity;
        }

        // Есть ли переход через разряд хотя бы в одном разряде (единицы, десятки, ...)
        function hasCarry(a, b) {
            for (; a > 0 || b > 0; a = Math.floor(a / 10), b = Math.floor(b / 10)) {
                if (a % 10 + b % 10 >= 10) return true;
            }
            return false;
        }

        // Нужно ли занимать из старшего разряда при вычитании a - b (a >= b)
        function hasBorrow(a, b) {
            for (; b > 0; a = Math.floor(a / 10), b = Math.floor(b / 10)) {
                if (a % 10 < b % 10) return true;
            }
            return false;
        }

        // Тип вычислений действует только для целых неотрицательных чисел больше 10
        function complexityApplies(settings) {
            return settings.range > 10 && !settings.negatives && !settings.fractions && !settings.decimals
                && settings.complexity !== 'all';
        }

        // Подходит ли сложение или вычитание total ± value под выбранный тип вычислений
        function transitionAllowed(total, sign, value, settings) {
            if (!complexityApplies(settings)) return true;
            const transition = sign > 0 ? hasCarry(total.n, value.n) : hasBorrow(total.n, value.n);
            return settings.complexity === 'carry' ? transition : !transition;
        }

        function inRange(value, settings) {
            return ratCmp(value, rat(settings.range)) <= 0
                && ratCmp(value, rat(settings.negatives ? -settings.range : 0)) >= 0;
        }

        // Значение можно записать так, как пишут числа в этом примере: с обыкновенными дробями
        // знаменатель не больше MAX_DENOMINATOR, только с десятичными — не больше выбранного
        // числа знаков после запятой, а без дробей — целое
        function fitsNotation(value, kinds, settings) {
            if (kinds.frac) return value.d <= MAX_DENOMINATOR;
            if (kinds.dec) return decimalPlaces(value) <= settings.decimalPlaces;
            return value.d === 1;
        }

        // Числа от 10 000 пишутся с разделением разрядов: «456 789»
        function formatNumber(value) {
            const text = String(Math.abs(value));
            return Math.abs(value) >= 10000 ? text.replace(/\B(?=(\d{3})+$)/g, THIN_NBSP) : text;
        }

        // Десятичная дробь через запятую: «3,75»
        function formatDecimal(value) {
            const places = decimalPlaces(value);
            const digits = String(Math.abs(value.n) * Math.pow(10, places) / value.d).padStart(places + 1, '0');
            const whole = formatNumber(Number(digits.slice(0, digits.length - places)));
            return places ? whole + ',' + digits.slice(-places) : whole;
        }

        /*
         * Число в примере — operand: { kind, value, whole, num, den }.
         * kind: 'int' — целое, 'frac' — обыкновенная дробь (whole — целая часть смешанного числа,
         * num/den — дробная часть как она написана, без сокращения), 'dec' — десятичная дробь.
         * Возвращает запись числа без знака: html — с чертой дроби, text — строкой «2 3/4».
         */
        function renderAbs(operand) {
            if (operand.kind === 'frac') {
                const whole = operand.whole ? formatNumber(operand.whole) : '';
                return {
                    html: whole + '<span class="frac"><span>' + operand.num + '</span><span>' + operand.den + '</span></span>',
                    text: (whole ? whole + MIXED_SEPARATOR : '') + operand.num + '/' + operand.den
                };
            }
            const text = operand.kind === 'dec' ? formatDecimal(operand.value) : formatNumber(operand.value.n);
            return { html: text, text };
        }

        // Отрицательное число в начале примера пишется «−5», внутри — в скобках «(−5)»
        function renderOperand(operand, isFirst) {
            const abs = renderAbs(operand);
            if (operand.value.n >= 0) return abs;
            const wrap = s => isFirst ? '−' + s : '(−' + s + ')';
            return { html: wrap(abs.html), text: wrap(abs.text) };
        }

        function withSign(operand, sign) {
            return sign > 0 ? operand : Object.assign({}, operand, { value: ratNeg(operand.value) });
        }

        function randomSign(settings) { return settings.negatives && Math.random() < NEGATIVE_SHARE ? -1 : 1; }

        // Какое число поставить: при включённых дробях четверть чисел — целые
        function pickKind(settings) {
            const kinds = [];
            if (settings.fractions) kinds.push('frac');
            if (settings.decimals) kinds.push('dec');
            if (!kinds.length || Math.random() < INT_SHARE) return 'int';
            return kinds[getRandomInt(0, kinds.length - 1)];
        }

        // Обыкновенная дробь не больше max: правильная или смешанное число.
        // В режиме одинаковых знаменателей у всех дробей примера знаменатель state.den («2/8 + 3/8»),
        // в режиме разных дроби несократимые, как в учебнике
        function randomFraction(settings, state, max) {
            const den = settings.sameDenominators ? state.den : getRandomInt(2, MAX_FRACTION_DEN);
            let num = getRandomInt(1, den - 1);
            while (!settings.sameDenominators && gcd(num, den) > 1) num = getRandomInt(1, den - 1);
            const maxWhole = ratFloor(ratAdd(max, rat(-num, den)));
            if (maxWhole < 0) return null;
            const whole = Math.random() < MIXED_SHARE ? getRandomInt(1, Math.max(1, maxWhole)) : 0;
            if (whole > maxWhole) return null;
            return { kind: 'frac', whole, num, den, value: rat(whole * den + num, den) };
        }

        // Десятичная дробь не больше max, от 1 знака после запятой до выбранного в настройках
        function randomDecimal(settings, max) {
            const scale = Math.pow(10, getRandomInt(1, settings.decimalPlaces));
            const maxScaled = ratFloor(ratMul(max, rat(scale)));
            for (let attempt = 0; attempt < 5 && maxScaled >= 1; attempt++) {
                const scaled = getRandomInt(1, maxScaled);
                if (scaled % 10) return { kind: 'dec', value: rat(scaled, scale) };   // не «2,50» и не «3,0»
            }
            return null;
        }

        // Единица старшего разряда, на разряд меньше предела: до 100 — 10, до 1000 — 100, до 9 999 999 — 1 000 000
        function lowerUnit(range) { return Math.pow(10, Math.floor(Math.log10(range + 1)) - 1); }

        // В коротких примерах стартовое число на разряд меньше предела или той же разрядности:
        // до 100 — от 11 до 89, до 1000 — от 101 до 899 и т. д. В длинных — любое: цепочке сложений
        // нужно начинать с малого, вычитаний — с большого
        function getInitialValue(settings) {
            const maxRange = settings.range;
            if (settings.actions > 2 || maxRange <= 20) return getRandomInt(1, maxRange - 1);
            const unit = lowerUnit(maxRange);
            return getRandomInt(unit + 1, maxRange - unit - 1);
        }

        /*
         * Пример хранится как сумма слагаемых, поэтому порядок действий соблюдается сам собой:
         * «12 + 3 × 4 − 10 ÷ 5» — это слагаемые 12, +(3 × 4) и −(10 ÷ 5).
         * Умножение и деление применяются либо к последнему слагаемому («2 + 6 ÷ 2»),
         * либо ко всему примеру в скобках («(2 + 6) ÷ 2»).
         * state: { terms: [{ sign, html, text, value, operand }], total, kinds, den };
         * operand есть у слагаемого из одного числа, kinds — какие дроби уже есть в примере
         */
        function termsJoin(terms, field) {
            return terms.map((t, i) => i === 0 ? t[field] : ' ' + (t.sign > 0 ? '+' : '−') + NBSP + t[field]).join('');
        }

        function withKind(kinds, kind) {
            return kind === 'int' ? kinds : Object.assign({}, kinds, { [kind]: true });
        }

        // При пределе от 100 к многозначному числу прибавляется число не меньше lowerUnit:
        // до 100 — от 10, до 1000 — от 100 и т. д.
        function minOperand(total, settings) {
            const unit = lowerUnit(settings.range);
            return settings.range >= 100 && Math.abs(ratFloor(total)) > unit ? unit : 1;
        }

        function transitionFree(settings) {
            return complexityApplies(settings) && settings.complexity === 'no-carry';
        }

        // Число от min до max без перехода через разряд: каждая цифра подбирается так,
        // чтобы в своём разряде не было переноса (сложение) или заёма (вычитание).
        // Случайным перебором такое многозначное число почти не найти.
        // Пока старшие цифры совпадают с цифрами max (tight), следующая не больше цифры max — число не превысит max
        function randomWithoutTransition(total, sign, min, max) {
            const digits = String(max).length;
            for (let attempt = 0; attempt < 20; attempt++) {
                let value = 0, tight = true;
                for (let i = digits - 1; i >= 0; i--) {
                    const unit = Math.pow(10, i);
                    const totalDigit = Math.floor(total / unit) % 10;
                    const maxDigit = Math.floor(max / unit) % 10;
                    const limit = sign > 0 ? 9 - totalDigit : totalDigit;
                    const digit = getRandomInt(0, tight ? Math.min(limit, maxDigit) : limit);
                    if (digit < maxDigit) tight = false;
                    value = value * 10 + digit;
                }
                if (value >= min) return value;
            }
            return null;
        }

        // Целое слагаемое от 1 до max (max — дробь), или null
        function randomIntOperand(state, sign, max, settings) {
            const maxInt = ratFloor(max);
            if (maxInt < 1) return null;
            const min = Math.min(minOperand(state.total, settings), maxInt);
            const value = transitionFree(settings)
                ? randomWithoutTransition(state.total.n, sign, min, maxInt)
                : getRandomInt(min, maxInt);
            // «+ 1» и «− 1» нужны, но изредка: большинство единиц отбрасывается
            if (value === null || (value === 1 && Math.random() > ONE_SHARE)) return null;
            return { kind: 'int', value: rat(value) };
        }

        // remaining — сколько действий ещё впереди
        function tryAdditive(state, op, settings, remaining) {
            const sign = op === '+' ? 1 : -1;
            // Когда сумма может только расти (одно сложение) или только убывать (одно вычитание),
            // каждому слагаемому достаётся доля оставшегося запаса до предела, иначе длинная цепочка
            // в него упрётся. При смешанных + и − сумма колеблется сама, и запас не нужен
            const oneWay = !settings.negatives && !settings.ops.includes(op === '+' ? '-' : '+');
            for (let attempt = 0; attempt < 20; attempt++) {
                const kind = pickKind(settings);
                const operandSign = randomSign(settings);
                // Насколько можно сдвинуть сумму в нужную сторону, не выходя за пределы счёта
                const room = sign * operandSign > 0
                    ? ratAdd(rat(settings.range), ratNeg(state.total))
                    : ratAdd(state.total, rat(settings.negatives ? settings.range : 0));
                let max = ratCmp(room, rat(settings.range)) < 0 ? room : rat(settings.range);
                if (oneWay) max = ratDiv(max, rat(remaining + 1));
                if (max.n <= 0) continue;

                let operand = kind === 'int' ? randomIntOperand(state, sign, max, settings)
                            : kind === 'frac' ? randomFraction(settings, state, max)
                            : randomDecimal(settings, max);
                if (!operand) continue;
                operand = withSign(operand, operandSign);
                if (!transitionAllowed(state.total, sign, operand.value, settings)) continue;

                const total = ratAdd(state.total, sign > 0 ? operand.value : ratNeg(operand.value));
                const kinds = withKind(state.kinds, kind);
                if (!inRange(total, settings) || !fitsNotation(total, kinds, settings)) continue;
                const shown = renderOperand(operand, false);
                return {
                    terms: [...state.terms, { sign, html: shown.html, text: shown.text, value: operand.value, operand }],
                    total, kinds, den: state.den
                };
            }
            return null;
        }

        // Множитель и делитель: до 100 — табличные (до 10), до 1000 — до 20, дальше — двузначные
        function factorLimit(settings) {
            if (settings.range <= 100) return 10;
            return settings.range === 1000 ? 20 : 99;
        }

        // Целое число перед × или ÷ подбирается заново под множитель или делитель: «7 × 8», «56 ÷ 8».
        // Знак числа сохраняется
        function rebuildPlain(base, op, settings, isFirst) {
            const factor = randomSign(settings) * getRandomInt(2, factorLimit(settings));
            const maxQuotient = Math.floor(settings.range / Math.abs(factor));
            if (maxQuotient < 2) return null;
            const n = getRandomInt(2, maxQuotient);
            const number = (base.value.n < 0 ? -1 : 1) * (op === '*' ? n : n * Math.abs(factor));
            const left = renderOperand({ kind: 'int', value: rat(number) }, isFirst);
            const right = renderOperand({ kind: 'int', value: rat(factor) }, false);
            return {
                sign: base.sign,
                html: left.html + ' ' + OP_SIGNS[op] + NBSP + right.html,
                text: left.text + ' ' + OP_SIGNS[op] + NBSP + right.text,
                value: op === '*' ? rat(number * factor) : rat(number / factor)
            };
        }

        // Целый множитель или делитель целого числа от 2 до factorLimit, частное по модулю не меньше 2:
        // без «13 ÷ 13» и «450 ÷ 225»
        function pickIntFactor(base, op, settings) {
            const limit = factorLimit(settings);
            const sign = randomSign(settings);
            if (op === '*') {
                if (base === 0) return null;
                const max = Math.min(limit, Math.floor(settings.range / Math.abs(base)));
                return max < 2 ? null : sign * getRandomInt(2, max);
            }
            const divisors = [];
            for (let d = 2; d <= limit && d < Math.abs(base); d++) {
                if (base % d === 0) divisors.push(d);
            }
            return divisors.length ? sign * divisors[getRandomInt(0, divisors.length - 1)] : null;
        }

        // Множитель или делитель для base любого вида: целый, обыкновенная или десятичная дробь
        function pickFactor(base, op, settings) {
            let kind = pickKind(settings);
            // С одинаковыми знаменателями тренируют сложение и вычитание дробей: умножают и делят на целое
            if (kind === 'frac' && settings.sameDenominators) kind = 'int';
            let operand;
            if (kind === 'int') {
                const value = base.d === 1 ? pickIntFactor(base.n, op, settings)
                                           : randomSign(settings) * getRandomInt(2, factorLimit(settings));
                if (value === null) return null;
                operand = { kind, value: rat(value) };
            } else {
                const max = rat(op === '*' ? 3 : factorLimit(settings));
                operand = kind === 'frac' ? randomFraction(settings, { den: 0 }, max) : randomDecimal(settings, max);
                if (!operand) return null;
                operand = withSign(operand, randomSign(settings));
            }
            return operand;
        }

        function tryMultiplicative(state, op, settings) {
            const wrap = state.terms.length > 1 && Math.random() < PARENS_SHARE;
            const base = wrap ? { sign: 1, html: '(' + termsJoin(state.terms, 'html') + ')', text: '(' + termsJoin(state.terms, 'text') + ')', value: state.total }
                              : state.terms[state.terms.length - 1];
            const rest = wrap ? [] : state.terms.slice(0, -1);

            let term, kinds = state.kinds;
            if (base.operand && base.operand.kind === 'int' && pickKind(settings) === 'int' && (op === '/' || Math.random() < 0.5)) {
                term = rebuildPlain(base, op, settings, rest.length === 0);
            } else {
                const factor = pickFactor(base.value, op, settings);
                if (factor) {
                    const shown = renderOperand(factor, false);
                    term = {
                        sign: base.sign,
                        html: base.html + ' ' + OP_SIGNS[op] + NBSP + shown.html,
                        text: base.text + ' ' + OP_SIGNS[op] + NBSP + shown.text,
                        value: op === '*' ? ratMul(base.value, factor.value) : ratDiv(base.value, factor.value)
                    };
                    kinds = withKind(kinds, factor.kind);
                }
            }
            if (!term) return null;

            const restTotal = rest.reduce((sum, t) => ratAdd(sum, t.sign > 0 ? t.value : ratNeg(t.value)), rat(0));
            const total = ratAdd(restTotal, term.sign > 0 ? term.value : ratNeg(term.value));
            if (ratCmp(ratAbs(term.value), rat(settings.range)) > 0 || !inRange(total, settings)) return null;
            if (!fitsNotation(term.value, kinds, settings) || !fitsNotation(total, kinds, settings)) return null;
            if (rest.length && !transitionAllowed(restTotal, term.sign, term.value, settings)) return null;
            return { terms: [...rest, term], total, kinds, den: state.den };
        }

        function startState(settings) {
            const state = { terms: [], total: rat(0), kinds: {}, den: getRandomInt(2, MAX_FRACTION_DEN) };
            const kind = pickKind(settings);
            const max = rat(settings.range);
            let operand = kind === 'int' ? { kind, value: rat(getInitialValue(settings)) }
                        : kind === 'frac' ? randomFraction(settings, state, max)
                        : randomDecimal(settings, max);
            if (!operand) return null;
            operand = withSign(operand, randomSign(settings));
            const shown = renderOperand(operand, true);
            state.terms.push({ sign: 1, html: shown.html, text: shown.text, value: operand.value, operand });
            state.total = operand.value;
            state.kinds = withKind(state.kinds, kind);
            return state;
        }

        // Если действие не получилось, пробуется другое из выбранных, а если не выходит и так,
        // пример собирается заново: невыбранные операции в нём не появляются.
        // При включённых дробях в каждом примере есть хотя бы одна дробь.
        // answerKind — как вводить ответ: 'frac' — обыкновенной дробью, 'dec' — десятичной, 'int' — целым
        function generateExample(settings) {
            const needFraction = settings.fractions || settings.decimals;
            // Чтобы при невозможных настройках сообщение появилось сразу, а не через полминуты
            const deadline = Date.now() + GENERATION_BUDGET_MS;
            for (let attempt = 0; attempt < 300 && Date.now() < deadline; attempt++) {
                let state = startState(settings);
                if (!state) continue;
                let done = 0;

                for (; done < settings.actions; done++) {
                    let next = null;
                    for (let tries = 0; tries < 30 && !next; tries++) {
                        const op = settings.ops[getRandomInt(0, settings.ops.length - 1)];
                        next = (op === '+' || op === '-') ? tryAdditive(state, op, settings, settings.actions - done - 1)
                                                          : tryMultiplicative(state, op, settings);
                    }
                    if (!next) break;
                    state = next;
                }
                if (done < settings.actions || (needFraction && !state.kinds.frac && !state.kinds.dec)) continue;
                return {
                    html: termsJoin(state.terms, 'html'),
                    text: termsJoin(state.terms, 'text'),
                    answer: state.total,
                    answerKind: state.kinds.frac ? 'frac' : state.kinds.dec ? 'dec' : 'int'
                };
            }
            return null;
        }

        function startTimer() {
            clearInterval(timerInterval); secondsElapsed = 0;
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
                const secs = (secondsElapsed % 60).toString().padStart(2, '0');
                document.getElementById('timer-display').innerText = mins + ':' + secs;
            }, 1000);
        }

        // Ответ обыкновенной дробью — три поля: целая часть, числитель над знаменателем
        function answerFieldsHtml(example) {
            const field = (cls, mode) => '<input type="text" inputmode="' + mode + '" enterkeyhint="next" autocomplete="off" class="answer-input ' + cls + '">';
            if (example.answerKind === 'frac') {
                return '<span class="frac-answer">' + field('answer-whole', 'decimal') +
                       '<span class="frac-input">' + field('answer-num', 'numeric') + '<span class="frac-bar"></span>' +
                       field('answer-den', 'numeric') + '</span></span>';
            }
            return field('answer-single', example.answerKind === 'dec' ? 'decimal' : 'numeric');
        }

        function generateTraining() {
            const container = document.getElementById('examples-container');
            container.innerHTML = ''; currentExamples = []; isTrainingActive = false;
            clearInterval(timerInterval);
            const settings = getSettings();
            if (settings.ops.length === 0) { alert('Выберите операции в настройках!'); toggleModal(true); return; }

            for (let i = 0; i < EXAMPLES_COUNT; i++) {
                const example = generateExample(settings);
                if (!example) {
                    currentExamples = [];
                    alert('С такими настройками не получается составить примеры. Уменьшите количество действий, выберите больше операций или увеличьте предел счёта.');
                    toggleModal(true);
                    return;
                }
                currentExamples.push(example);
            }
            currentSettings = settings;

            // Поле ответа вмещает все цифры предела, минус и знаки после запятой
            const answerChars = String(settings.range).length + (settings.negatives ? 1 : 0) +
                                (settings.decimals ? settings.decimalPlaces + 1 : 0);
            container.style.setProperty('--answer-width', Math.max(4.4, answerChars * 0.75 + 1).toFixed(2) + 'em');

            currentExamples.forEach(example => {
                const item = document.createElement('div');
                item.className = 'example-item';
                item.innerHTML = '<span class="example-text">' + example.html + NBSP + '=</span>' +
                                 (settings.negatives ? '<button type="button" class="sign-toggle" tabindex="-1" title="Сменить знак ответа">±</button>' : '') +
                                 answerFieldsHtml(example);
                item.querySelector('.example-text').setAttribute('aria-label', example.text + ' =');
                container.appendChild(item);
            });
            fitColumnsToExamples(container);
            isTrainingActive = true;
            let hint = 'Решите примеры и нажмите «Проверка».';
            if (currentExamples.some(ex => ex.answerKind === 'frac')) hint += ' Дробь вводится в три поля: целая часть, числитель и знаменатель.';
            if (currentExamples.some(ex => ex.answerKind !== 'int')) hint += ' Десятичную дробь можно писать через запятую или точку.';
            startTimer(); document.getElementById('hint-text').innerText = hint;
        }

        // Ширина колонки — по самому длинному примеру в одну строку, но не больше 34em:
        // ещё более длинные примеры переносятся. Задаётся в em, поэтому подходит при любом размере шрифта
        function fitColumnsToExamples(container) {
            container.classList.add('measuring');
            const fontSize = parseFloat(getComputedStyle(container).fontSize);
            const widest = Math.max(...[...container.children].map(item => item.scrollWidth));
            container.classList.remove('measuring');
            container.style.setProperty('--col-min', Math.min(widest / fontSize + 0.2, 34).toFixed(2) + 'em');
        }

        // Целое или десятичное число: «-5», «−5», «12 345», «3,75», «3.75». Иначе null
        function parseNumberText(raw) {
            const text = raw.replace(/[−–]/g, '-').replace(/\s/g, '').replace(',', '.');
            const match = /^(-?)(\d+)(?:\.(\d+))?$/.exec(text);
            if (!match) return null;
            const fraction = match[3] || '';
            const value = rat(Number(match[2] + fraction), Math.pow(10, fraction.length));
            return match[1] ? ratNeg(value) : value;
        }

        /*
         * Читает ответ из полей примера. Возвращает { empty } или { value, form }, где form —
         * как ответ записан: целая часть, числитель и знаменатель (для проверки сокращения).
         * value === null — записано не число
         */
        function readAnswer(item) {
            const get = cls => { const el = item.querySelector('.' + cls); return el ? el.value.trim() : ''; };
            if (!item.querySelector('.answer-whole')) {
                const raw = get('answer-single');
                return raw === '' ? { empty: true } : { value: parseNumberText(raw) };
            }
            const whole = get('answer-whole'), num = get('answer-num'), den = get('answer-den');
            if (!whole && !num && !den) return { empty: true };
            if (!num && !den) return { value: parseNumberText(whole), form: { decimal: /[.,]/.test(whole) } };

            const clean = s => s.replace(/[−–]/g, '-').replace(/\s/g, '');
            const w = clean(whole), n = clean(num), d = clean(den);
            if (!/^-?\d*$/.test(w) || !/^-?\d+$/.test(n) || !/^\d+$/.test(d) || Number(d) === 0) return { value: null };
            const negative = w.startsWith('-') || n.startsWith('-');
            const W = Math.abs(Number(w || 0)), N = Math.abs(Number(n)), D = Number(d);
            const value = rat(W * D + N, D);
            return { value: negative ? ratNeg(value) : value, form: { whole: W, num: N, den: D } };
        }

        // Записан ли верный ответ так, как требуют в школе: дробь несократимая, целая часть выделена.
        // Возвращает null, если записан правильно, или подсказку, что исправить
        function fractionFormIssue(answer, form) {
            if (form.decimal) return 'запишите ответ обыкновенной дробью';
            if (!form.den) return null;                       // записано целым числом
            if (form.num === 0) return 'дробная часть равна нулю — запишите целым числом';
            if (gcd(form.num, form.den) > 1) return 'сократите дробь';
            if (form.num >= form.den) return 'выделите целую часть';
            return null;
        }

        function markAnswer(item, state, title) {
            item.querySelectorAll('.answer-input').forEach(el => {
                el.classList.remove('correct', 'incorrect', 'almost');
                if (state) el.classList.add(state);
                if (state === 'correct') el.disabled = true;
            });
            if (title) item.title = 'Почти верно: ' + title; else item.removeAttribute('title');
        }

        function checkAnswers() {
            if (currentExamples.length === 0 || !isTrainingActive) return;
            let totalCorrect = 0, totalWrong = 0, totalEmpty = 0, totalAlmost = 0;
            const items = document.getElementById('examples-container').children;
            currentExamples.forEach((ex, idx) => {
                const item = items[idx];
                const answer = readAnswer(item);
                if (answer.empty) { markAnswer(item, null); totalEmpty++; return; }
                if (!answer.value || !ratEq(answer.value, ex.answer)) { markAnswer(item, 'incorrect'); totalWrong++; return; }
                const issue = ex.answerKind === 'frac' && currentSettings.strictFractions && fractionFormIssue(ex.answer, answer.form);
                if (issue) { markAnswer(item, 'almost', issue); totalAlmost++; return; }
                markAnswer(item, 'correct'); totalCorrect++;
            });
            if (totalCorrect === currentExamples.length) {
                clearInterval(timerInterval); isTrainingActive = false;
                document.getElementById('hint-text').innerHTML = '<strong>Супер!</strong> Все примеры решены верно!';
            } else {
                let hint = 'Правильно: ' + totalCorrect + ' из ' + currentExamples.length + '.';
                if (totalWrong) hint += ' Исправьте ошибки в красных полях.';
                if (totalAlmost) hint += ' Жёлтые — верно, но дробь нужно сократить или выделить целую часть: ' + totalAlmost + '.';
                if (totalEmpty) hint += ' Не решено: ' + totalEmpty + '.';
                document.getElementById('hint-text').innerText = hint;
            }
        }

        // Enter переходит к следующему пустому полю, после последнего — проверка
        function focusNextAnswer(fromInput) {
            const inputs = [...document.querySelectorAll('.answer-input')];
            const start = inputs.indexOf(fromInput);
            const next = inputs.slice(start + 1).concat(inputs.slice(0, start))
                               .find(el => !el.disabled && el.value.trim() === '');
            if (next) next.focus(); else { fromInput.blur(); checkAnswers(); }
        }

        // Знак ставится перед целой частью, а если её нет — перед числителем
        function toggleAnswerSign(button) {
            const inputs = [...button.closest('.example-item').querySelectorAll('.answer-input')];
            const input = inputs.length > 1 && !inputs[0].value.trim() ? inputs[1] : inputs[0];
            if (input.disabled) return;
            const value = input.value.replace(/[−–]/g, '-');
            input.value = value.startsWith('-') ? value.slice(1) : '-' + value;
            input.focus();
        }

        // Экранная клавиатура: высота, которую она закрывает, уходит в --keyboard-height
        // (отступ снизу страницы), а пример с полем ввода прокручивается в видимую часть экрана
        function keepAnswerVisible(input) {
            const item = input.closest('.example-item');
            const vv = window.visualViewport;
            const top = vv ? vv.offsetTop : 0;
            const bottom = vv ? vv.offsetTop + vv.height : window.innerHeight;
            const rect = item.getBoundingClientRect();
            if (rect.top < top || rect.bottom > bottom - 8) item.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }

        function setupKeyboardAvoidance() {
            const vv = window.visualViewport;
            if (!vv) return;
            vv.addEventListener('resize', () => {
                const keyboard = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
                document.documentElement.style.setProperty('--keyboard-height', keyboard + 'px');
                const active = document.activeElement;
                if (keyboard > 0 && active && active.classList.contains('answer-input')) keepAnswerVisible(active);
            });
        }

        function setupAnswerInputs() {
            const container = document.getElementById('examples-container');
            container.addEventListener('keydown', e => {
                if (e.key === 'Enter' && e.target.classList.contains('answer-input')) {
                    e.preventDefault(); focusNextAnswer(e.target);
                }
            });
            container.addEventListener('click', e => {
                const button = e.target.closest('.sign-toggle');
                if (button) toggleAnswerSign(button);
            });
            // Клавиатура выезжает с анимацией, поэтому положение проверяется с задержкой
            container.addEventListener('focusin', e => {
                if (e.target.classList.contains('answer-input')) setTimeout(() => keepAnswerVisible(e.target), 350);
            });
        }

        window.onload = function() {
            loadAllSettings();
            setupAnswerInputs();
            setupKeyboardAvoidance();
            generateTraining();
        };
    </script>
</body>
</html>
