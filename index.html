<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Математический тренажёр</title>
    <style>
        :root {
            --bg-color: #f0f2f5; --panel-bg: #ffffff; --text-color: #333;
            --primary-color: #4a90e2; --success-color: #2ecc71; --error-color: #e74c3c;
            --border-color: #ccc; --item-bg: #f8fafc; --item-border: #e2e8f0;
            --keyboard-height: 0px;
        }
        [data-theme="dark"] {
            --bg-color: #1a1a1a; --panel-bg: #2d2d2d; --text-color: #ecf0f1;
            --primary-color: #3498db; --success-color: #27ae60; --error-color: #c0392b;
            --item-bg: #3a3a3a; --item-border: #4a4a4a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden; padding: 10px; transition: background 0.3s;
        }
        .top-bar {
            background: var(--panel-bg); padding: 10px 20px; border-radius: 8px;
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-shrink: 0;
        }
        .controls-left { display: flex; gap: 10px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        .btn-start { background-color: var(--primary-color); color: white; }
        .btn-check { background-color: var(--success-color); color: white; }
        .btn-settings { background-color: #7f8c8d; color: white; }
        .btn-theme { background-color: #f1c40f; color: #333; }
        .btn:hover { opacity: 0.9; }
        .workspace { display: flex; flex: 1; gap: 10px; min-height: 0; }
        /* Ширина колонки (--col-min) зависит от длины самого длинного примера, её задаёт generateTraining() */
        .examples-grid {
            flex: 1; background: var(--panel-bg); border-radius: 8px; padding: 15px; overflow-y: auto;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--col-min, 11em)), 1fr));
            grid-auto-rows: 1fr; gap: 12px; align-content: start;
            font-size: clamp(18px, 0.9vw + 1vh, 30px); font-weight: bold;
        }
        .example-item {
            background: var(--item-bg); border: 1px solid var(--item-border); border-radius: 8px;
            display: flex; align-items: center; gap: 0.4em; padding: 0.4em 0.6em;
        }
        .example-text { flex: 1; text-align: right; line-height: 1.35; }
        /* Только на время замера ширины в fitColumnsToExamples() */
        .examples-grid.measuring { grid-template-columns: max-content; }
        .examples-grid.measuring .example-item { width: max-content; }
        .examples-grid.measuring .example-text { white-space: nowrap; }
        .answer-input { width: 4.4em; flex-shrink: 0; padding: 0.3em; font-size: 0.8em; font-weight: bold; text-align: center; border: 2px solid var(--border-color); border-radius: 6px; outline: none; background: var(--panel-bg); color: var(--text-color); }
        .answer-input.correct { border-color: var(--success-color); background-color: rgba(46,204,113,0.15); color: var(--success-color); }
        .answer-input.incorrect { border-color: var(--error-color); background-color: rgba(231,76,60,0.15); }
        .sign-toggle { flex-shrink: 0; width: 1.7em; height: 1.7em; font-size: 0.7em; font-weight: bold; border: 1px solid var(--border-color); border-radius: 6px; background: var(--panel-bg); color: var(--text-color); cursor: pointer; }
        .sidebar { width: 220px; background: var(--panel-bg); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .info-box { border: 1px dashed var(--border-color); border-radius: 6px; padding: 10px; text-align: center; font-size: 14px; }
        .timer-display { font-size: 28px; font-weight: bold; font-family: monospace; }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center; z-index: 1000; visibility: hidden; opacity: 0; transition: opacity 0.2s;
        }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-content { background: var(--panel-bg); color: var(--text-color); padding: 25px; border-radius: 10px; width: 450px; max-width: 90%; max-height: 90%; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .modal-header { font-size: 20px; font-weight: bold; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .setting-row { display: flex; flex-direction: column; gap: 5px; }
        .setting-row label { font-weight: 500; font-size: 14px; }
        .setting-row select, .setting-row input { padding: 6px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-color); color: var(--text-color); }
        .setting-row .checkbox-row { display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .checkbox-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px; }
        .checkbox-list label { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
        /* Телефоны и планшеты: страница прокручивается, а снизу остаётся место под экранную клавиатуру,
           чтобы нижние примеры можно было поднять над ней */
        @media (max-width: 900px), (pointer: coarse), (hover: none) {
            body { height: auto; min-height: 100vh; overflow: auto; padding-bottom: calc(10px + var(--keyboard-height)); }
            .top-bar { flex-wrap: wrap; gap: 10px; padding: 10px; }
            .controls-left { flex-wrap: wrap; }
            .workspace { flex-direction: column-reverse; }
            .sidebar { width: auto; flex-direction: row; }
            .sidebar .info-box { flex: 1; }
            .examples-grid { overflow: visible; grid-auto-rows: auto; padding: 10px; font-size: clamp(20px, 2vw + 12px, 28px); }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="controls-left">
            <button class="btn btn-start" onclick="generateTraining()">Старт</button>
            <button class="btn btn-check" onclick="checkAnswers()">Проверка</button>
            <button class="btn btn-settings" onclick="toggleModal(true)">⚙️ Настройки</button>
        </div>
        <button class="btn btn-theme" onclick="toggleTheme()">🌓 Тема</button>
    </div>

    <div class="workspace">
        <div class="examples-grid" id="examples-container"></div>
        <div class="sidebar">
            <div class="info-box">
                <div class="timer-display" id="timer-display">00:00</div>
                <div style="font-size:12px; margin-top:5px;">Время тренировки</div>
            </div>
            <div class="info-box" style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
                <small id="hint-text">Нажмите «Старт» для начала.</small>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="settings-modal" onclick="if(event.target===this) toggleModal(false)">
        <div class="modal-content">
            <div class="modal-header">Настройки тренажёра</div>
            <div class="setting-row">
                <label>Арифметические операции:</label>
                <div class="checkbox-list">
                    <label><input type="checkbox" id="op-add" checked onchange="saveAllSettings()"> Сложение (+)</label>
                    <label><input type="checkbox" id="op-sub" checked onchange="saveAllSettings()"> Вычитание (−)</label>
                    <label><input type="checkbox" id="op-mul" onchange="saveAllSettings()"> Умножение (×)</label>
                    <label><input type="checkbox" id="op-div" onchange="saveAllSettings()"> Деление (÷)</label>
                </div>
            </div>
            <div class="setting-row">
                <label for="actions-count">Количество действий в примере (1–10):</label>
                <input type="number" id="actions-count" min="1" max="10" value="1" onchange="saveAllSettings()">
            </div>
            <div class="setting-row">
                <label for="max-range">Предел и сложность счёта:</label>
                <select id="max-range" onchange="adjustComplexityOptions(); saveAllSettings();">
                    <option value="10">До 10 (однозначные)</option>
                    <option value="20">До 20 (переход через десяток)</option>
                    <option value="100" selected>До 100 (двузначные)</option>
                    <option value="1000">До 1000 (трёхзначные)</option>
                </select>
            </div>
            <div class="setting-row">
                <label class="checkbox-row"><input type="checkbox" id="opt-negatives" onchange="adjustComplexityOptions(); saveAllSettings();"> Отрицательные числа</label>
            </div>
            <div class="setting-row" id="complexity-container">
                <label for="complexity-type">Тип вычислений:</label>
                <select id="complexity-type" onchange="saveAllSettings()">
                    <option value="all" selected>Все типы примеров</option>
                    <option value="no-carry">Без перехода / без заимствования</option>
                    <option value="carry">Обязательно с переходом / с заимствованием</option>
                </select>
            </div>
            <button class="btn btn-start" style="margin-top:10px;" onclick="toggleModal(false); generateTraining();">Применить и Начать</button>
        </div>
    </div>
    <script>
        let currentExamples = []; let timerInterval = null; let secondsElapsed = 0;
        let isTrainingActive = false;
        const EXAMPLES_COUNT = 20;
        const MAX_ACTIONS = 10;
        const OP_SIGNS = { '+': '+', '-': '−', '*': '×', '/': '÷' };
        const NBSP = ' ';          // знак действия не отрывается от числа при переносе строки
        const NEGATIVE_SHARE = 0.3;     // доля отрицательных чисел, когда они включены
        const PARENS_SHARE = 0.35;      // доля «(a + b) × c» среди умножений и делений после сложения

        function toggleModal(show) { document.getElementById('settings-modal').classList.toggle('active', show); }

        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', currentTheme);
            localStorage.setItem('math_trainer_theme', currentTheme);
        }

        // Переход через разряд имеет смысл только для неотрицательных чисел и чисел больше 10
        function adjustComplexityOptions() {
            const range = document.getElementById('max-range').value;
            const negatives = document.getElementById('opt-negatives').checked;
            document.getElementById('complexity-container').style.display = (range === '10' || negatives) ? 'none' : 'flex';
        }

        function saveAllSettings() {
            const config = {
                add: document.getElementById('op-add').checked,
                sub: document.getElementById('op-sub').checked,
                mul: document.getElementById('op-mul').checked,
                div: document.getElementById('op-div').checked,
                actions: document.getElementById('actions-count').value,
                range: document.getElementById('max-range').value,
                negatives: document.getElementById('opt-negatives').checked,
                complexity: document.getElementById('complexity-type').value
            };
            localStorage.setItem('math_trainer_config', JSON.stringify(config));
        }

        function loadAllSettings() {
            const savedTheme = localStorage.getItem('math_trainer_theme');
            if (savedTheme) document.body.setAttribute('data-theme', savedTheme);

            const savedConfig = localStorage.getItem('math_trainer_config');
            if (savedConfig) {
                try {
                    const config = JSON.parse(savedConfig);
                    document.getElementById('op-add').checked = config.add;
                    document.getElementById('op-sub').checked = config.sub;
                    document.getElementById('op-mul').checked = config.mul;
                    document.getElementById('op-div').checked = config.div;
                    document.getElementById('actions-count').value = config.actions;
                    document.getElementById('max-range').value = config.range;
                    document.getElementById('opt-negatives').checked = !!config.negatives;
                    document.getElementById('complexity-type').value = config.complexity;
                } catch(e) { console.error("Ошибка чтения конфига", e); }
            }
            adjustComplexityOptions();
        }

        function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

        function getSelectedOperations() {
            const ops = [];
            if (document.getElementById('op-add').checked) ops.push('+');
            if (document.getElementById('op-sub').checked) ops.push('-');
            if (document.getElementById('op-mul').checked) ops.push('*');
            if (document.getElementById('op-div').checked) ops.push('/');
            return ops;
        }

        function getSettings() {
            return {
                ops: getSelectedOperations(),
                actions: Math.min(Math.max(parseInt(document.getElementById('actions-count').value) || 1, 1), MAX_ACTIONS),
                range: parseInt(document.getElementById('max-range').value) || 100,
                negatives: document.getElementById('opt-negatives').checked,
                complexity: document.getElementById('complexity-type').value
            };
        }

        // Есть ли переход через разряд хотя бы в одном разряде (единицы, десятки, ...)
        function hasCarry(a, b) {
            for (; a > 0 || b > 0; a = Math.floor(a / 10), b = Math.floor(b / 10)) {
                if (a % 10 + b % 10 >= 10) return true;
            }
            return false;
        }

        // Нужно ли занимать из старшего разряда при вычитании a - b (a >= b)
        function hasBorrow(a, b) {
            for (; b > 0; a = Math.floor(a / 10), b = Math.floor(b / 10)) {
                if (a % 10 < b % 10) return true;
            }
            return false;
        }

        // Подходит ли сложение или вычитание total ± value под выбранный тип вычислений
        function transitionAllowed(total, sign, value, settings) {
            if (settings.range <= 10 || settings.negatives || settings.complexity === 'all') return true;
            const transition = sign > 0 ? hasCarry(total, value) : hasBorrow(total, value);
            return settings.complexity === 'carry' ? transition : !transition;
        }

        function inRange(value, settings) {
            return value <= settings.range && value >= (settings.negatives ? -settings.range : 0);
        }

        function formatFirst(value) { return value < 0 ? '−' + (-value) : String(value); }
        function formatOperand(value) { return value < 0 ? '(−' + (-value) + ')' : String(value); }
        function randomSign(settings) { return settings.negatives && Math.random() < NEGATIVE_SHARE ? -1 : 1; }

        // В длинных примерах стартовое число любое: цепочке сложений нужно начинать с малого, вычитаний — с большого
        function getInitialValue(settings) {
            const maxRange = settings.range;
            if (settings.actions > 2) return getRandomInt(1, maxRange - 1);
            if (maxRange === 10) return getRandomInt(1, 9);
            if (maxRange === 20) return getRandomInt(1, 19);
            if (maxRange === 100) return getRandomInt(11, 89);
            if (maxRange === 1000) return getRandomInt(101, 899);
            return getRandomInt(1, maxRange - 1);
        }

        /*
         * Пример хранится как сумма слагаемых, поэтому порядок действий соблюдается сам собой:
         * «12 + 3 × 4 − 10 ÷ 5» — это слагаемые 12, +(3 × 4) и −(10 ÷ 5).
         * Умножение и деление применяются либо к последнему слагаемому («2 + 6 ÷ 2»),
         * либо ко всему примеру в скобках («(2 + 6) ÷ 2»).
         * state: { terms: [{ sign, text, value, plain }], total }; plain — слагаемое из одного числа
         */
        function termsText(terms) {
            return terms.map((t, i) => i === 0 ? t.text : ' ' + (t.sign > 0 ? '+' : '−') + NBSP + t.text).join('');
        }

        function minOperand(total, settings) {
            if (settings.range === 100 && Math.abs(total) > 10) return 10;
            if (settings.range === 1000 && Math.abs(total) > 100) return 100;
            return 1;
        }

        // remaining — сколько действий ещё впереди: под них оставляется запас до предела счёта
        function tryAdditive(state, op, settings, remaining) {
            const sign = op === '+' ? 1 : -1;
            const minNext = minOperand(state.total, settings);
            for (let attempt = 0; attempt < 20; attempt++) {
                const operandSign = randomSign(settings);
                // Насколько можно сдвинуть сумму в нужную сторону, не выходя за пределы счёта
                const direction = sign * operandSign;
                const maxMagnitude = direction > 0 ? settings.range - state.total
                                                   : state.total + (settings.negatives ? settings.range : 0);
                if (maxMagnitude < 1) continue;
                const cap = Math.max(1, Math.floor(maxMagnitude / (remaining + 1)));
                const value = operandSign * getRandomInt(cap >= minNext ? minNext : 1, cap);
                if (!transitionAllowed(state.total, sign, value, settings)) continue;
                return {
                    terms: [...state.terms, { sign, text: formatOperand(value), value, plain: true }],
                    total: state.total + sign * value
                };
            }
            return null;
        }

        function factorLimit(settings) { return settings.range === 1000 ? 20 : 10; }

        // Число перед × или ÷ подбирается заново под множитель или делитель: «7 × 8», «56 ÷ 8».
        // Знак числа сохраняется
        function rebuildPlain(base, op, settings, isFirst) {
            const factor = randomSign(settings) * getRandomInt(2, factorLimit(settings));
            const maxQuotient = Math.floor(settings.range / Math.abs(factor));
            if (maxQuotient < 2) return null;
            const n = getRandomInt(2, maxQuotient);
            const number = Math.sign(base.value || 1) * (op === '*' ? n : n * Math.abs(factor));
            const value = op === '*' ? number * factor : number / factor;
            const text = (isFirst ? formatFirst(number) : formatOperand(number)) + ' ' + OP_SIGNS[op] + NBSP + formatOperand(factor);
            return { sign: base.sign, text, value };
        }

        // Множитель от 2 до 10 (до 20 для 1000), делитель такой же и частное по модулю не меньше 2:
        // без «13 ÷ 13» и «450 ÷ 225»
        function pickFactor(base, op, settings) {
            const limit = factorLimit(settings);
            const sign = randomSign(settings);
            if (op === '*') {
                if (base === 0) return null;
                const max = Math.min(limit, Math.floor(settings.range / Math.abs(base)));
                return max < 2 ? null : sign * getRandomInt(2, max);
            }
            const divisors = [];
            for (let d = 2; d <= limit && d < Math.abs(base); d++) {
                if (base % d === 0) divisors.push(d);
            }
            return divisors.length ? sign * divisors[getRandomInt(0, divisors.length - 1)] : null;
        }

        function tryMultiplicative(state, op, settings) {
            const wrap = state.terms.length > 1 && Math.random() < PARENS_SHARE;
            const base = wrap ? { sign: 1, text: '(' + termsText(state.terms) + ')', value: state.total }
                              : state.terms[state.terms.length - 1];
            const rest = wrap ? [] : state.terms.slice(0, -1);

            let term;
            if (base.plain && (op === '/' || Math.random() < 0.5)) {
                term = rebuildPlain(base, op, settings, rest.length === 0);
            } else {
                const factor = pickFactor(base.value, op, settings);
                if (factor !== null) term = {
                    sign: base.sign,
                    text: base.text + ' ' + OP_SIGNS[op] + NBSP + formatOperand(factor),
                    value: op === '*' ? base.value * factor : base.value / factor
                };
            }
            if (!term) return null;

            const restTotal = rest.reduce((sum, t) => sum + t.sign * t.value, 0);
            const total = restTotal + term.sign * term.value;
            if (Math.abs(term.value) > settings.range || !inRange(total, settings)) return null;
            if (rest.length && !transitionAllowed(restTotal, term.sign, term.value, settings)) return null;
            return { terms: [...rest, term], total };
        }

        // Если действие не получилось, пробуется другое из выбранных, а если не выходит и так,
        // пример собирается заново: невыбранные операции в нём не появляются
        function generateExample(settings) {
            for (let attempt = 0; attempt < 300; attempt++) {
                const first = randomSign(settings) * getInitialValue(settings);
                let state = { terms: [{ sign: 1, text: formatFirst(first), value: first, plain: true }], total: first };
                let done = 0;

                for (; done < settings.actions; done++) {
                    let next = null;
                    for (let tries = 0; tries < 30 && !next; tries++) {
                        const op = settings.ops[getRandomInt(0, settings.ops.length - 1)];
                        next = (op === '+' || op === '-') ? tryAdditive(state, op, settings, settings.actions - done - 1)
                                                          : tryMultiplicative(state, op, settings);
                    }
                    if (!next) break;
                    state = next;
                }
                if (done === settings.actions) return { text: termsText(state.terms), answer: state.total };
            }
            return null;
        }

        function startTimer() {
            clearInterval(timerInterval); secondsElapsed = 0;
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
                const secs = (secondsElapsed % 60).toString().padStart(2, '0');
                document.getElementById('timer-display').innerText = mins + ':' + secs;
            }, 1000);
        }

        function generateTraining() {
            const container = document.getElementById('examples-container');
            container.innerHTML = ''; currentExamples = []; isTrainingActive = false;
            clearInterval(timerInterval);
            const settings = getSettings();
            if (settings.ops.length === 0) { alert('Выберите операции в настройках!'); toggleModal(true); return; }

            for (let i = 0; i < EXAMPLES_COUNT; i++) {
                const example = generateExample(settings);
                if (!example) {
                    currentExamples = [];
                    alert('С такими настройками не получается составить примеры. Уменьшите количество действий, выберите больше операций или увеличьте предел счёта.');
                    toggleModal(true);
                    return;
                }
                currentExamples.push(example);
            }

            currentExamples.forEach((example, i) => {
                const item = document.createElement('div');
                item.className = 'example-item';
                item.innerHTML = '<span class="example-text">' + example.text + NBSP + '=</span>' +
                                 (settings.negatives ? '<button type="button" class="sign-toggle" tabindex="-1" title="Сменить знак ответа">±</button>' : '') +
                                 '<input type="text" inputmode="numeric" enterkeyhint="next" autocomplete="off" class="answer-input" id="input-ans-' + i + '">';
                container.appendChild(item);
            });
            fitColumnsToExamples(container);
            isTrainingActive = true;
            startTimer(); document.getElementById('hint-text').innerText = 'Решите примеры и нажмите «Проверка».';
        }

        // Ширина колонки — по самому длинному примеру в одну строку, но не больше 34em:
        // ещё более длинные примеры переносятся. Задаётся в em, поэтому подходит при любом размере шрифта
        function fitColumnsToExamples(container) {
            container.classList.add('measuring');
            const fontSize = parseFloat(getComputedStyle(container).fontSize);
            const widest = Math.max(...[...container.children].map(item => item.scrollWidth));
            container.classList.remove('measuring');
            container.style.setProperty('--col-min', Math.min(widest / fontSize + 0.2, 34).toFixed(2) + 'em');
        }

        // Принимает «-5» и «−5»; всё, что не целое число, считается ошибкой
        function parseAnswer(raw) {
            const text = raw.replace(/[−–]/g, '-');
            return /^-?\d+$/.test(text) ? Number(text) : NaN;
        }

        function checkAnswers() {
            if (currentExamples.length === 0 || !isTrainingActive) return;
            let totalCorrect = 0, totalWrong = 0, totalEmpty = 0;
            currentExamples.forEach((ex, idx) => {
                const inputEl = document.getElementById('input-ans-' + idx);
                const raw = inputEl.value.trim(); inputEl.classList.remove('correct', 'incorrect');
                if (raw === '') { totalEmpty++; return; }
                if (parseAnswer(raw) === ex.answer) {
                    inputEl.classList.add('correct'); inputEl.disabled = true; totalCorrect++;
                } else { inputEl.classList.add('incorrect'); totalWrong++; }
            });
            if (totalCorrect === currentExamples.length) {
                clearInterval(timerInterval); isTrainingActive = false;
                document.getElementById('hint-text').innerHTML = '<strong>Супер!</strong> Все примеры решены верно!';
            } else {
                let hint = 'Правильно: ' + totalCorrect + ' из ' + currentExamples.length + '.';
                if (totalWrong) hint += ' Исправьте ошибки в красных полях.';
                if (totalEmpty) hint += ' Не решено: ' + totalEmpty + '.';
                document.getElementById('hint-text').innerText = hint;
            }
        }

        // Enter переходит к следующему нерешённому примеру, после последнего — проверка
        function focusNextAnswer(fromInput) {
            const inputs = [...document.querySelectorAll('.answer-input')];
            const start = inputs.indexOf(fromInput);
            const next = inputs.slice(start + 1).concat(inputs.slice(0, start))
                               .find(el => !el.disabled && el.value.trim() === '');
            if (next) next.focus(); else { fromInput.blur(); checkAnswers(); }
        }

        function toggleAnswerSign(button) {
            const input = button.nextElementSibling;
            if (input.disabled) return;
            const value = input.value.replace(/[−–]/g, '-');
            input.value = value.startsWith('-') ? value.slice(1) : '-' + value;
            input.focus();
        }

        // Экранная клавиатура: высота, которую она закрывает, уходит в --keyboard-height
        // (отступ снизу страницы), а пример с полем ввода прокручивается в видимую часть экрана
        function keepAnswerVisible(input) {
            const item = input.closest('.example-item');
            const vv = window.visualViewport;
            const top = vv ? vv.offsetTop : 0;
            const bottom = vv ? vv.offsetTop + vv.height : window.innerHeight;
            const rect = item.getBoundingClientRect();
            if (rect.top < top || rect.bottom > bottom - 8) item.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }

        function setupKeyboardAvoidance() {
            const vv = window.visualViewport;
            if (!vv) return;
            vv.addEventListener('resize', () => {
                const keyboard = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
                document.documentElement.style.setProperty('--keyboard-height', keyboard + 'px');
                const active = document.activeElement;
                if (keyboard > 0 && active && active.classList.contains('answer-input')) keepAnswerVisible(active);
            });
        }

        function setupAnswerInputs() {
            const container = document.getElementById('examples-container');
            container.addEventListener('keydown', e => {
                if (e.key === 'Enter' && e.target.classList.contains('answer-input')) {
                    e.preventDefault(); focusNextAnswer(e.target);
                }
            });
            container.addEventListener('click', e => {
                const button = e.target.closest('.sign-toggle');
                if (button) toggleAnswerSign(button);
            });
            // Клавиатура выезжает с анимацией, поэтому положение проверяется с задержкой
            container.addEventListener('focusin', e => {
                if (e.target.classList.contains('answer-input')) setTimeout(() => keepAnswerVisible(e.target), 350);
            });
        }

        window.onload = function() {
            loadAllSettings();
            setupAnswerInputs();
            setupKeyboardAvoidance();
            generateTraining();
        };
    </script>
</body>
</html>
